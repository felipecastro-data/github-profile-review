name = "github-review"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# Runs, profiles, index and Actions ticks (see scripts/publish.py). Phase 5 replaces the placeholder id
# with the real namespace (wrangler kv namespace create github-review); local dev ignores it.
[[kv_namespaces]]
binding = "GR_KV"
id = "00000000000000000000000000000000"

[vars]
ACCESS_TEAM_DOMAIN = "odd-paper-fda0.cloudflareaccess.com"
# Application Audience (AUD) tag of the "GitHub Review" Access application; until set, /api/* returns 401.
ACCESS_AUD = ""
